<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lumina Event | Administración</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body data-pagina="admin">
  <header class="encabezado">
    <div class="contenedor navegacion">
      <a class="logo" href="index.html">Lumina Event</a>
      <nav data-menu aria-label="Navegación principal"></nav>
    </div>
  </header>

  <main class="seccion">
    <div class="contenedor">
      <h1>Panel de administración</h1>
      <p>Agrega servicios al catálogo local. Estos datos se guardan en este navegador y no representan pagos ni contratos.</p>
      <p id="total-catalogo"></p>

      <form id="formulario-admin" class="formulario" novalidate>
        <div class="campo">
          <label for="admin-nombre">Nombre del servicio</label>
          <input type="text" id="admin-nombre" name="nombre" maxlength="60" required>
        </div>
        <div class="campo">
          <label for="admin-categoria">Categoría</label>
          <select id="admin-categoria" name="categoria" required></select>
        </div>
        <div class="campo">
          <label for="admin-precio">Precio (MXN)</label>
          <input type="number" id="admin-precio" name="precio" min="0" step="1" required>
        </div>
        <div class="campo">
          <label for="admin-proveedor">Proveedor</label>
          <input type="text" id="admin-proveedor" name="proveedor" maxlength="60">
        </div>
        <div class="campo">
          <label for="admin-descripcion">Descripción</label>
          <textarea id="admin-descripcion" name="descripcion" rows="2" maxlength="160"></textarea>
        </div>
        <p id="aviso-admin" class="aviso" role="status" aria-live="polite"></p>
        <button type="submit" class="boton">Agregar servicio</button>
      </form>

      <h2>Servicios agregados</h2>
      <ul class="lista-evento" id="lista-admin"></ul>
    </div>
  </main>

  <footer class="pie">
    <p>Lumina Event · Proyecto de Aplicaciones Web · 2026</p>
  </footer>
  <script src="vendor/sql-wasm.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
