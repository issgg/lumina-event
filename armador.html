<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lumina Event | Armador</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body data-pagina="armador">
  <header class="encabezado">
    <div class="contenedor navegacion">
      <a class="logo" href="index.html">Lumina Event</a>
      <nav data-menu aria-label="Navegación principal"></nav>
    </div>
  </header>

  <main class="seccion">
    <div class="contenedor">
      <h1>Armador de eventos</h1>
      <p>Completa los datos de tu evento y ajusta los servicios que agregaste desde el catálogo.</p>

      <form id="formulario-evento" class="formulario" novalidate>
        <fieldset>
          <legend>Datos del evento</legend>

          <div class="campo">
            <label for="nombre">Nombre de quien organiza</label>
            <input type="text" id="nombre" name="nombre" maxlength="60" required>
            <span id="error-nombre" class="aviso-error"></span>
          </div>

          <div class="campo">
            <label for="tipo-evento">Tipo de evento</label>
            <select id="tipo-evento" name="tipoEvento" required></select>
            <span id="error-tipoEvento" class="aviso-error"></span>
          </div>

          <div class="campo">
            <label for="fecha">Fecha</label>
            <input type="date" id="fecha" name="fecha" required>
            <span id="error-fecha" class="aviso-error"></span>
          </div>

          <div class="campo">
            <label for="invitados">Número de invitados</label>
            <input type="number" id="invitados" name="invitados" min="1" max="10000" step="1" required>
            <span id="error-invitados" class="aviso-error"></span>
          </div>

          <div class="campo">
            <label for="presupuesto">Presupuesto aproximado (MXN)</label>
            <input type="number" id="presupuesto" name="presupuesto" min="0" step="1" required>
            <span id="error-presupuesto" class="aviso-error"></span>
          </div>

          <div class="campo">
            <label for="hora-inicio">Hora de inicio</label>
            <input type="time" id="hora-inicio" name="horaInicio" required>
            <span id="error-horaInicio" class="aviso-error"></span>
          </div>

          <div class="campo">
            <label for="salon">Salón del evento</label>
            <select id="salon" name="salonId" required></select>
            <span id="error-salonId" class="aviso-error"></span>
          </div>
        </fieldset>

        <p id="aviso-armador" class="aviso" role="status" aria-live="polite"></p>
        <button type="submit" class="boton" id="btn-guardar-armador">Guardar borrador</button>
      </form>

      <h2>Servicios seleccionados</h2>
      <ul class="lista-evento" id="lista-evento"></ul>
      <p class="total">Total estimado: <span id="total-evento">$0</span></p>
      <p><a class="boton" href="resumen.html">Ver resumen final</a></p>
    </div>
  </main>

  <footer class="pie">
    <p>Lumina Event · Proyecto de Aplicaciones Web · 2026</p>
  </footer>
  <script type="module" src="js/main.js"></script>
</body>
</html>
